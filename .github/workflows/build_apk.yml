name: Build Signed Release AAB & APK with R8

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ekstrak dan Perbaiki Manifest, Resource, Gradle & Java
        run: |
          unzip -q NyxTools.zip -d proyek_ekstrak
          find proyek_ekstrak -name "documentfile.jar" -delete
          find proyek_ekstrak -name "xbanner.jar" -delete
          find proyek_ekstrak -type d -name "mipmap-anydpi*" -exec rm -rf {} +

          pip install Pillow --quiet

          if [ -f "app_icon.png" ]; then
            python3 -c 'from PIL import Image; Image.open("app_icon.png").convert("RGBA").save("app_icon_valid.png", "PNG")'
            find proyek_ekstrak/app/src/main/res -type f \( -name "ic_launcher.png" -o -name "ic_launcher.webp" -o -name "ic_launcher_round.png" -o -name "ic_launcher_round.webp" \) -exec cp -f "app_icon_valid.png" {} \;
          fi

          LOGO_ASLI=$(find proyek_ekstrak/app/src/main/res -type f \( -name "app_icon.png" -o -name "app_icon.webp" -o -name "icon.png" \) | head -n 1)
          if [ -n "$LOGO_ASLI" ]; then
            echo "Logo asli ditemukan di: $LOGO_ASLI"
            export LOGO_PATH="$LOGO_ASLI"
            python3 -c 'import os; from PIL import Image; Image.open(os.environ["LOGO_PATH"]).convert("RGBA").save("logo_asli_valid.png", "PNG")'
            find proyek_ekstrak/app/src/main/res -type f \( -name "ic_launcher.png" -o -name "ic_launcher.webp" -o -name "ic_launcher_round.png" -o -name "ic_launcher_round.webp" \) -exec cp -f "logo_asli_valid.png" {} \;
          fi

          MANIFEST=$(find proyek_ekstrak -path "*/src/main/AndroidManifest.xml" | head -n 1)
          MAIN_DIR=$(dirname "$MANIFEST")
          RES_VALUES="$MAIN_DIR/res/values"
          RES_LAYOUT="$MAIN_DIR/res/layout"
          JAVA_PKG_DIR="$MAIN_DIR/java/com/nyx/tools"
          HUD_PKG_DIR="$MAIN_DIR/java/com/kaopiz/kprogresshud"
          ROOT_DIR=$(dirname $(find proyek_ekstrak -name "settings.gradle" | head -n 1))
          mkdir -p "$RES_VALUES" "$RES_LAYOUT" "$JAVA_PKG_DIR" "$HUD_PKG_DIR"

          # 1. Perbaiki AndroidManifest.xml & bersihkan duplikat
          export MANIFEST_PATH="$MANIFEST"
          python3 -c '
          import os, re
          path = os.environ.get("MANIFEST_PATH")
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          text = re.sub(r"\s*package=\"[^\"]*\"", "", text, count=1)
          text = text.replace("@style/AppTheme.DebugActivity", "@style/AppTheme")
          text = re.sub(r'(<activity[^>]*android:name="\.DebugActivity"[^>]*?)\s*android:screenOrientation="[^"]*"', r'\1', text)
          provider_xml = "<provider android:name=\"rikka.shizuku.ShizukuProvider\" android:authorities=\"${applicationId}.shizuku\" android:multiprocess=\"false\" android:enabled=\"true\" android:exported=\"true\" android:permission=\"android.permission.INTERACT_ACROSS_USERS_FULL\" /></application>"
          text = text.replace("</application>", provider_xml, 1)

          class Deduplicator:
              def __init__(self):
                  self.seen = False
              def __call__(self, m):
                  if self.seen:
                      return ""
                  self.seen = True
                  return m.group(0)

          text = re.sub(r"<activity[^>]*android:name=\"com\.google\.android\.gms\.ads\.AdActivity\"[^>]*/>", Deduplicator(), text)
          text = re.sub(r"<uses-permission[^>]*android:name=\"com\.google\.android\.gms\.permission\.AD_ID\"[^>]*/>", Deduplicator(), text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          '

          # 2. Tambahkan style bawaan & warna KProgressHUD
          cat << 'EOF' > "$RES_VALUES/fix_sketchware_missing.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.AppBarOverlay" parent="ThemeOverlay.AppCompat.Dark.ActionBar" />
              <style name="AppTheme.PopupOverlay" parent="ThemeOverlay.AppCompat.Light" />
              <color name="kprogresshud_default_color">#b1000000</color>
              <color name="kprogresshud_grey_color">#449E9E9E</color>
          </resources>
          EOF

          if [ ! -f "$RES_LAYOUT/kprogresshud_hud.xml" ]; then
          cat << 'EOF' > "$RES_LAYOUT/kprogresshud_hud.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <com.kaopiz.kprogresshud.BackgroundLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/background"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:padding="16dp"
              android:background="@android:color/transparent"
              android:gravity="center"
              android:orientation="vertical">
              <FrameLayout android:id="@+id/container" android:layout_width="wrap_content" android:layout_height="wrap_content" />
              <TextView android:id="@+id/label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:visibility="gone" />
              <TextView android:id="@+id/details_label" android:layout_width="wrap_content" android:layout_height="wrap_content" android:visibility="gone" />
          </com.kaopiz.kprogresshud.BackgroundLayout>
          EOF
          fi
          
          mkdir -p "$MAIN_DIR/res/raw"
          cat << 'EOF' > "$MAIN_DIR/res/raw/keep.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://android.com" tools:keep="@layout/ext,@layout/kprogresshud_hud" />
          EOF

          # 3c. Ganti KProgressHUD menjadi android.app.Dialog di semua file Downloader & Handler
          python3 -c '
          import glob, re
          for fpath in glob.glob("proyek_ekstrak/**/src/main/java/**/*.java", recursive=True):
              with open(fpath, "r", encoding="utf-8") as f: c = f.read()
              if "KProgressHUD" in c:
                  c = re.sub(r"import\s+com\.kaopiz\.kprogresshud\.KProgressHUD\s*;", "", c)
                  c = re.sub(r"hud\s*=\s*KProgressHUD\.create[\s\S]*?hud\.show\(\)\s*;", """hud = new android.app.Dialog(activity);
                  hud.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE);
                  hud.setContentView(v);
                  hud.setCancelable(false);
                  if (hud.getWindow() != null) {
                      hud.getWindow().setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(android.graphics.Color.TRANSPARENT));
                      hud.getWindow().setDimAmount(0.6f);
                  }
                  hud.show();""", c)
                  c = c.replace("KProgressHUD", "android.app.Dialog")
                  with open(fpath, "w", encoding="utf-8") as f: f.write(c)
          '

          # 3. Buat DebugActivity.java dengan tombol Salin & Close
          cat << 'EOF' > "$JAVA_PKG_DIR/DebugActivity.java"
          package com.nyx.tools;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.os.Bundle;
          import android.widget.Toast;
          public class DebugActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  final String err = getIntent().getStringExtra("error") != null ? getIntent().getStringExtra("error") : "Unknown error";
                  new AlertDialog.Builder(this)
                      .setTitle("Application Error")
                      .setMessage(err)
                      .setNegativeButton("Salin", new DialogInterface.OnClickListener() {
                          @Override public void onClick(DialogInterface d, int w) {
                              ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cm != null) {
                                  cm.setPrimaryClip(ClipData.newPlainText("ErrorLog", err));
                                  Toast.makeText(getApplicationContext(), "Log error berhasil disalin!", Toast.LENGTH_SHORT).show();
                              }
                              finish();
                          }
                      })
                      .setPositiveButton("Close", new DialogInterface.OnClickListener() {
                          @Override public void onClick(DialogInterface d, int w) { finish(); }
                      })
                      .setCancelable(false)
                      .create().show();
              }
          }
          EOF

          cat << 'EOF' > "$HUD_PKG_DIR/R.java"
          package com.kaopiz.kprogresshud;
          public final class R {
              public static final class layout {
                  public static final int kprogresshud_hud = com.nyx.tools.R.layout.kprogresshud_hud;
              }
              public static final class id {
                  public static final int background = com.nyx.tools.R.id.background;
                  public static final int container = com.nyx.tools.R.id.container;
                  public static final int label = com.nyx.tools.R.id.label;
                  public static final int details_label = com.nyx.tools.R.id.details_label;
              }
              public static final class color {
                  public static final int kprogresshud_default_color = com.nyx.tools.R.color.kprogresshud_default_color;
                  public static final int kprogresshud_grey_color = com.nyx.tools.R.color.kprogresshud_grey_color;
              }
          }
          EOF

          # 4. Naikkan minSdk ke 24 & pasang library AAR resmi Shizuku & XBanner
          sed -i "s|minSdkVersion 21|minSdkVersion 24|g" "$ROOT_DIR/app/build.gradle"

          # Tambahkan konfigurasi AdActivity dengan enableOnBackInvokedCallback="false" dan tools:replace
          python3 -c 'import os, re; p = os.environ["MANIFEST_PATH"]; s = open(p).read(); s = s if "xmlns:tools=" in s else re.sub(r"<manifest\b", "<manifest xmlns:tools=\"http://android.com\"", s, count=1); s = re.sub(r"<activity[^>]*com\.google\.android\.gms\.ads\.AdActivity[^>]*/>", "", s); ad = "<activity android:name=\"com.google.android.gms.ads.AdActivity\" android:configChanges=\"keyboard|keyboardHidden|orientation|screenLayout|uiMode|screenSize|smallestScreenSize\" android:theme=\"@android:style/Theme.Translucent\" android:enableOnBackInvokedCallback=\"false\" tools:replace=\"android:configChanges,android:theme,android:enableOnBackInvokedCallback\" />\n</application>"; s = s.replace("</application>", ad, 1); open(p, "w").write(s)'

          sed -i "s|minSdk 21|minSdk 24|g" "$ROOT_DIR/app/build.gradle"
          sed -i "s|shrinkResources true|shrinkResources false|g" "$ROOT_DIR/app/build.gradle"
          sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://jitpack.io' }|g" "$ROOT_DIR/build.gradle"
          cat << 'EOF' >> "$ROOT_DIR/app/build.gradle"

          dependencies {
              implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
              implementation 'com.google.firebase:firebase-common:21.0.0'
              implementation 'com.github.xiaohaibin:XBanner:androidx_v1.1.3'
          }
          EOF

          # 5. Kapasitas RAM Gradle 4GB & R8 Full Mode
          cat << 'EOF' > "$ROOT_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8.fullMode=true
          EOF

          # 6. Aturan R8 lengkap untuk Shizuku, KProgressHUD & XBanner
          cat << 'EOF' >> "$ROOT_DIR/app/proguard-rules.pro"

          -ignorewarnings
          -keep class com.nyx.tools.** { *; }
          -keep public class * extends android.view.View {
              public <init>(android.content.Context);
              public <init>(android.content.Context, android.util.AttributeSet);
              public <init>(android.content.Context, android.util.AttributeSet, int);
          }

          -dontwarn **
          -keep class com.kaopiz.kprogresshud.** { *; }
          -keep class com.stx.xhb.** { *; }
          -keep class dev.rikka.shizuku.** { *; }
          -keep class rikka.shizuku.** { *; }
          -keep class moe.shizuku.** { *; }
          -keep class com.AndroidSketchwareMaster.** { *; }
          -keep class * extends android.content.ContentProvider { *; }
          EOF

      - name: Siapkan Keystore dan Konfigurasi Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ROOT_DIR=$(dirname $(find proyek_ekstrak -name "settings.gradle" | head -n 1))
          echo "$KEYSTORE_BASE64" | base64 -d > "$ROOT_DIR/app/release-key.jks"
          cat << 'EOF' >> "$ROOT_DIR/app/build.gradle"
          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Signed Release AAB & APK (R8 Full Mode)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PROJECT_DIR=$(dirname $(find proyek_ekstrak -name "settings.gradle" | head -n 1))
          cd "$PROJECT_DIR"
          gradle bundleRelease assembleRelease --stacktrace

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-aab
          path: proyek_ekstrak/**/app/build/outputs/bundle/release/*.aab

      - name: Upload Signed APK Artifact (Untuk Tes Instal)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-apk
          path: proyek_ekstrak/**/app/build/outputs/apk/release/*.apk

      - name: Upload ProGuard/R8 Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-txt
          path: proyek_ekstrak/**/app/build/outputs/mapping/release/mapping.txt
